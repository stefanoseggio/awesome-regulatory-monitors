<script>
	document.getElementById("resetear").addEventListener("click", (e) => {
		e.preventDefault()

		document.getElementById("tipo_licitacion").value = ""
		document.getElementById("anio").value = "";
		document.getElementById("estado").value = ""
		document.getElementById("palabra").value = ""
		document.getElementById("cmb_organismo").value = ""
	})

	function enviarTamanio(height) {
		window.parent.postMessage(
			{ height: height + 50 },
			"*"
		);
	};

	function getBase64(selector) {
		let c = document.createElement('canvas');
		let img = document.querySelector(selector);
		c.height = img.naturalHeight * 0.8;
		c.width = img.naturalWidth * 0.8;
		let ctx = c.getContext('2d');

		ctx.drawImage(img, 0, 0, c.width, c.height);
		return c.toDataURL();
	}

	$(document).ready(function () {
		let primeraCarga = Boolean(``);

		window.addEventListener('DOMContentLoaded', () => {
			enviarTamanio(document.getElementById("container").scrollHeight)
		})

		const table = $('#tabla-resultados').DataTable({
			"dom": "Blrt<'pagination-container'ip>",
			"paging": 'false',
			"ordering": 'false',
			"order": [],
			"pageLength": primeraCarga ? 0 : 10,
			"scrollX": /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
			scrollCollapse: true,
			columnDefs: [{
				targets: "_all",
				sortable: false
			}],
			layout: {
				topStart: {
					buttons: ['pdf']
				}
			},
			buttons: [{
				text: "PDF",
				extend: 'pdfHtml5',
				title: 'Unidad Central de Contrataciones',
				messageTop: 'Procedimientos de Contrataciï¿½n: Próximas Aperturas',
				className: "pdf-button",
				customize: function (obj) {
					const [subTitulo, busqueda] = obj.content[1].text.split(":")

					obj.content.splice(0, 0, { image: getBase64('#encabezado-contancia') })

					obj.content[1] = {
						text: `Fecha de consulta: ${new Date().toLocaleString("es-AR", {
							year: "numeric",
							month: "2-digit",
							day: "2-digit"
						})}`,
						margin: [0, 20, 0, 10]
					}
					obj.content[2].text = [`${subTitulo}: `, { text: busqueda, bold: true }]

					obj.content[3] = { ...obj.content[3], fontSize: 10 }


				},
				exportOptions: {
					columns: [0, 1, 2, 3, 4]
				}
			}],
			language: {
				"info": "Total _TOTAL_ registros",
				"infoEmpty": "",
				"lengthMenu": '',
				"zeroRecords": "Sin resultados encontrados",

				"paginate": {
					"sInfo": 'false', "sortable": '',
					"first": "Primero",
					"last": "Ultimo",
					"next": ">>",
					"previous": "<<",
				}
			},
			initComplete: function () {
				let pdfButtonTable = $('.pdf-button')[0];
				//En vez de usar el boton de dataTable utilizo uno custom
				$('#imprimir-resultado').on("click", () => pdfButtonTable.click())
				pdfButtonTable.style.display = "none"
			},
			drawCallback: function (settings) {
				let pagination = $(".pagination-container")
				if (0 <= 10 || primeraCarga)
					pagination.hide();
				else pagination.show();
			}
		});

		/* table.buttons().container()
			.appendTo('#imprimir-resultado'); */

		new ResizeObserver(entries => {
			for (let entry of entries) {
				enviarTamanio(entry.contentRect.height)
			}
		}).observe(document.querySelector("#container"))
	});
</script>
